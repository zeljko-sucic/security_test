{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">YOUR WORKSPACE</p><h1>Support tickets</h1></div><p>{{ g.user.display_name|badge }}</p></div>
<form class="search" action="{{ url_for('main.search') }}"><label class="grow">Search by title<input name="q" value="{{ query }}" placeholder="Search tickets…"></label><button>Search</button><a href="{{ url_for('main.tickets') }}">Reset</a></form>
<section class="card"><table><thead><tr><th>Ticket</th><th>Summary</th><th>Status</th></tr></thead><tbody>{% for ticket in tickets %}<tr><td>#{{ ticket.id }}</td><td><a href="{{ url_for('main.ticket_detail', ticket_id=ticket.id) }}">{{ ticket.title }}</a></td><td>{{ ticket.status|badge }}</td></tr>{% else %}<tr><td colspan="3">No tickets match your search.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
